name: Deploy to Staging

on:
  push:
    branches:
      - master

jobs:
  merge-to-staging-branch:
    runs-on: ubuntu-latest
    outputs:
      staging-branch-exists: ${{ steps.check-staging.outputs.exists }}
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Git identity
        run: |
          git config --global user.email "gitea@avegabros.com"
          git config --global user.name "Gitea"

      - id: check-staging
        name: Check if staging branch exists
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            echo "Staging branch already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Staging branch does not exist, creating now."
            git checkout -b staging
            git push origin staging
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge master into staging
        if: steps.check-staging.outputs.exists == 'true'
        run: |
          git checkout staging
          git fetch origin
          git merge origin/master --no-ff || echo "Nothing to merge or conflicts."

      - name: Push changes to staging branch
        if: steps.check-staging.outputs.exists == 'true'
        run: |
          git push origin staging || echo "Nothing to push."

  deploy-to-staging-server:
    needs: merge-to-staging-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up OS Tools
        run: |
          rm -f /etc/apt/sources.list.d/github_git-lfs.list
          apt-get update -o Acquire::Retries=3 || true
          apt-get install -y sshpass rsync

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Migrate Prisma
        run: npx prisma generate

      - name: Build NestJS
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking dist folder..."
          ls -la
          echo "Contents of dist:"
          ls -la dist
          echo "Recursive contents of dist:"
          ls -R dist || (echo "❌ dist folder missing!" && exit 1)

      - name: Upload to Staging Server
        env:
          STG_HOST: ${{ secrets.STG_HOST }}
          STG_USER: ${{ secrets.STG_USER }}
          STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
          STG_PATH: /home/avegabrosnet/public_html/abas-api-v2/
        run: |
          # sshpass -p "$STG_PASSWORD" rsync -avz --delete \
          #  -e "ssh -o StrictHostKeyChecking=no" \
          #  --exclude='.git' \
          #  --exclude='.gitea' \
          #  --exclude='src' \
          #  --exclude='dist/test' \
          #  --exclude='__test__' \
          #  API_documentation prisma views dist public package.json package-lock.json app.js nest-cli.json prisma.config.js tsconfig.json \
          #  $STG_USER@$STG_HOST:$STG_PATH

          MAX_RETRIES=3
          RETRY_DELAY=15
          attempt=1

          until sshpass -p "$STG_PASSWORD" rsync -avz --delete \
            --partial \
            --partial-dir=.rsync-partial \
            --timeout=120 \
            -e "ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
            --exclude='.git' \
            --exclude='.gitea' \
            --exclude='src' \
            --exclude='dist/test' \
            --exclude='__test__' \
            API_documentation prisma views dist node_modules public package.json package-lock.json app.js nest-cli.json prisma.config.js tsconfig.json \
            "$STG_USER@$STG_HOST:$STG_PATH"
          do
            if [ $attempt -ge $MAX_RETRIES ]; then
              echo "❌ rsync failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "⚠️ rsync attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
            attempt=$((attempt+1))
            sleep $RETRY_DELAY
          done

          echo "✅ rsync completed successfully on attempt $attempt"

      - name: Install deps & Run Prisma Migrations on Staging
        env:
          STG_HOST: ${{ secrets.STG_HOST }}
          STG_USER: ${{ secrets.STG_USER }}
          STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
          STG_PATH: /home/avegabrosnet/public_html/abas-api-v2
        run: |
          sshpass -p "$STG_PASSWORD" ssh -o StrictHostKeyChecking=no $STG_USER@$STG_HOST "
            export PATH=/opt/cpanel/ea-nodejs22/bin:\$PATH &&
            export \$(grep -v '^#' $STG_PATH/.env | xargs) &&
            cd $STG_PATH &&
            npm install --omit=dev &&
            npx prisma migrate deploy
          "

      - name: Restart Phusion Passenger
        env:
          STG_HOST: ${{ secrets.STG_HOST }}
          STG_USER: ${{ secrets.STG_USER }}
          STG_PASSWORD: ${{ secrets.STG_PASSWORD }}
          STG_PATH: /home/avegabrosnet/public_html/abas-api-v2
        run: |
          sshpass -p "$STG_PASSWORD" ssh -o StrictHostKeyChecking=no $STG_USER@$STG_HOST "
            mkdir -p $STG_PATH/tmp && touch $STG_PATH/tmp/restart.txt
          "
