name: Build & Validate (PR Check)

on:
  pull_request:
    branches:
      - master

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'node'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          npx prisma generate
          
      - name: Debug Environment
        run: |
          echo "===== System ====="
          pwd
          uname -a || true

          echo ""
          echo "===== Node ====="
          node -v
          npm -v

          echo ""
          echo "===== TypeScript ====="
          npx tsc -v

          echo ""
          echo "===== Prisma ====="
          npx prisma -v

          echo ""
          echo "===== Installed Packages ====="
          npm ls typescript
          npm ls eslint
          npm ls @typescript-eslint/parser
          npm ls @typescript-eslint/eslint-plugin
          npm ls @prisma/client
          npm ls prisma

          echo ""
          echo "===== Git ====="
          git rev-parse HEAD
          git status

          echo ""
          echo "===== Files ====="
          ls
          ls prisma || true

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        # run: npm test -- --ci --env=jsdom --reporters=default --reporters=jest-junit
        run: npm test -- --ci --passWithNoTests

      - name: Run Security Audit
        run: |
          npm audit --audit-level=high || true
          echo "Security audit completed"

      - name: Build NestJS
        run: npm run build
